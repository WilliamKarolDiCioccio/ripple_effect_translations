name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/check.dart

  # Every commit certifies the Developer Certificate of Origin (DCO) with a
  # Signed-off-by trailer. Checked here rather than by a third-party app so
  # the rule is one readable script in this repository.
  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -q .; then
              echo "::error::$(git log -1 --format='%h %s' "$commit") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with 'git commit -s' (or 'git rebase --signoff $BASE' for commits already made); CONTRIBUTING.md says why."
            exit 1
          fi
