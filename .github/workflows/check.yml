name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/check.dart

  # Every commit certifies the Developer Certificate of Origin (DCO) with a
  # Signed-off-by trailer carrying its author's email: a sign-off is the
  # author's own certification, so one in somebody else's name does not count.
  # Checked here rather than by a third-party app so the rule is one readable
  # script in this repository.
  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/sign-off.sh "$BASE" "$HEAD"
